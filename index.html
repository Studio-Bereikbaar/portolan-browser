<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" id="meta-description" content="">
    <meta name="og:type" content="website">
    <meta name="og:url" id="og-url" content="<%- catalogUrl %>">
    <meta property="og:title" id="og-title" content="<%- catalogTitle %>"/>
    <meta name="og:description" id="og-description" content="">
    <meta name="og:locale" id="og-locale" content="en">
    <meta name="og:site_name" content="<%- catalogTitle %>">
    <!--RC
    <base href="<%- pathPrefix %>" id="stac-browser-base">
    <script defer="defer" src="./runtime-config.js"></script>
    RC-->
    <link rel="icon" type="image/png" href="/sb-logo.png">
    <!-- SB: Google Fonts (Archivo) removed — no third-party requests from a
         public SB surface. ABC Diatype (SB huisstijl) is self-hosted from our
         own origin instead, so this stays a zero-third-party page.
         NB: confirm the Dinamo *webfont* licence covers a public domain — the
         desktop licence behind the internal Streamlit tools does not
         automatically extend to it. -->
    <style>
      @font-face {
        font-family: 'ABC Diatype';
        src: url('/fonts/ABCDiatype-Regular.woff2') format('woff2');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'ABC Diatype';
        src: url('/fonts/ABCDiatype-Medium.woff2') format('woff2');
        font-weight: 500; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'ABC Diatype';
        src: url('/fonts/ABCDiatype-Bold.woff2') format('woff2');
        font-weight: 700; font-style: normal; font-display: swap;
      }
    </style>
    <title><%- catalogTitle %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but STAC Browser doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
